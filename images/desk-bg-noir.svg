<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">자연광이 드는 밝은 작업 공간(블랙·레드 포인트)</title>
  <desc id="desc">흰 책상과 검은 모니터, 회색 장패드 위의 검은 프레임에 흰 키캡과 빨간 포인트가 있는 키보드와 흰 휠의 검은 마우스, 빨간 책이 섞인 책 더미와 빨간 추상화 액자가 있는 낮의 작업 공간이다.</desc>
  <defs>
    <linearGradient id="wall" x2="0.9" y2="1">
      <stop stop-color="#fcfbf8"/><stop offset="1" stop-color="#e8e5e0"/>
    </linearGradient>
    <linearGradient id="desk" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#ebe8e4"/>
    </linearGradient>
    <linearGradient id="window-light" gradientUnits="userSpaceOnUse" x1="60" y1="70" x2="490" y2="700">
      <stop stop-color="#ffffff" stop-opacity=".72"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".38"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="desk-seam" x2="0" y2="1">
      <stop stop-color="#141414" stop-opacity=".13"/><stop offset="1" stop-color="#141414" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stand" x2="1" y2=".2">
      <stop stop-color="#343434"/><stop offset=".45" stop-color="#1c1c1c"/><stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="book-side" x2="1" y2="0">
      <stop stop-color="#141414" stop-opacity="0"/><stop offset=".72" stop-color="#141414" stop-opacity=".05"/><stop offset="1" stop-color="#141414" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="mat-edge" x2="0" y2="1">
      <stop stop-color="#141414" stop-opacity="0"/><stop offset="1" stop-color="#141414" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mouse-shell" x2="1" y2=".7">
      <stop stop-color="#333333"/><stop offset=".5" stop-color="#1c1c1c"/><stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-150%" width="180%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="contact-shadow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft-light" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
