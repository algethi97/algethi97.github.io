<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방명록 | algethi97</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="standalone-page">

  <!-- 상단 네비게이션 헤더 -->
  <header class="nav-header">
    <div class="nav-inner">
      <!-- 좌측 상단: 홈페이지로 돌아오도록 하는 버튼 (픽토그램) -->
      <a href="index.html" class="home-button" aria-label="홈페이지로 돌아가기" title="홈페이지로 돌아가기">
        <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>

      <!-- 4칸짜리 탭 네비게이션 -->
      <div class="tabs-container">
        <nav class="tabs-grid four-tabs">
          <!-- 왼쪽 칸: 자기소개 -->
          <a href="about.html" class="tab-item" id="tab-about">
            👤 자기소개
          </a>
          <!-- 중앙 칸: 포트폴리오 -->
          <a href="portfolio.html" class="tab-item" id="tab-portfolio">
            💼 포트폴리오
          </a>
          <!-- 방명록 (현재 활성화된 탭) -->
          <a href="guestbook.html" class="tab-item active" id="tab-guestbook">
            📝 방명록
          </a>
          <!-- 우측 칸: 만다린 게임 -->
          <a href="game.html" class="tab-item" id="tab-game">
            🍊 만다린 게임
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Guestbook 📝</h1>
      <p class="page-subtitle">소중한 발자국을 남겨주세요. 남겨주신 메시지는 큰 힘이 됩니다!</p>
    </div>

    <!-- 방명록 작성 폼 카드 -->
    <section class="card guestbook-form-card">
      <div class="card-header-row">
        <h2>✍️ 방명록 작성하기</h2>
        <span class="safe-badge" title="안전한 암호화 통신 및 스팸 방어 적용">🔒 안심 방명록</span>
      </div>
      
      <form id="guestbook-form" class="guestbook-form" autocomplete="off">
        <!-- 봇 차단용 허니팟 필드 (사람 눈에는 보이지 않음) -->
        <div class="visually-hidden" aria-hidden="true">
          <label for="honeypot-website">Do not fill this</label>
          <input type="text" id="honeypot-website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="nickname" class="form-label">
            닉네임 <span class="required-star">*</span>
          </label>
          <input 
            type="text" 
            id="nickname" 
            class="form-input" 
            placeholder="닉네임을 입력하세요 (최대 20자)" 
            maxlength="20" 
            required
          >
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="message" class="form-label">
              메시지 내용 <span class="required-star">*</span>
            </label>
            <span class="char-count"><span id="char-count">0</span> / 500자</span>
          </div>
          <textarea 
            id="message" 
            class="form-textarea" 
            rows="4" 
            placeholder="따뜻한 인사말이나 피드백을 자유롭게 남겨주세요." 
            maxlength="500" 
            required
          ></textarea>
        </div>

        <div class="form-footer">
          <button type="submit" id="submit-btn" class="btn btn-primary guestbook-submit-btn">
            <span class="btn-text">📝 메시지 등록하기</span>
            <span class="btn-loader" style="display: none;"></span>
          </button>
        </div>

        <!-- 도배 방지 쿨다운 알림 바 -->
        <div id="cooldown-banner" class="cooldown-banner" style="display: none;">
          <span class="cooldown-icon">⏳</span>
          <span class="cooldown-text">도배 방지를 위해 <strong><span id="cooldown-timer">30</span>초</strong> 후에 추가 작성이 가능합니다.</span>
        </div>
      </form>
    </section>

    <!-- 남겨진 방명록 목록 섹션 -->
    <section class="card guestbook-list-section">
      <div class="card-header-row">
        <h2>💬 남겨진 이야기들</h2>
        <span class="count-pill">총 <strong id="total-count">0</strong>개</span>
      </div>

      <!-- 로딩 스켈레톤 -->
      <div id="guestbook-skeleton" class="guestbook-skeleton-wrap" style="display: none;">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- 방명록 리스트 -->
      <div id="guestbook-list" class="guestbook-list"></div>

      <!-- 방명록이 없을 때 Empty State -->
      <div id="guestbook-empty" class="guestbook-empty" style="display: none;">
        <div class="empty-icon">🍃</div>
        <p class="empty-title">아직 남겨진 방명록이 없습니다.</p>
        <p class="empty-desc">첫 번째 주인공이 되어 따뜻한 발자국을 남겨보세요!</p>
      </div>

      <!-- 이전 방명록 더보기 버튼 -->
      <div class="load-more-wrap">
        <button type="button" id="load-more-btn" class="btn load-more-btn" style="display: none;">
          <span class="btn-text">이전 방명록 더보기 ⬇️</span>
          <span class="btn-loader" style="display: none;"></span>
        </button>
      </div>
    </section>

    <!-- 홈으로 돌아가기 버튼 -->
    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html" style="color: var(--accent-orange); font-weight: 600;">&larr; 홈으로 돌아가기</a>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 algethi97. All rights reserved.</p>
  </footer>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 공통 스크립트 -->
  <script src="script.js"></script>
  <!-- 방명록 전용 스크립트 -->
  <script src="guestbook.js"></script>
</body>
</html>
