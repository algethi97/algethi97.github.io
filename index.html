<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈 | algethi97 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="nav-header">
    <div class="nav-inner">
      <!-- 좌측 상단: 홈페이지로 돌아오도록 하는 버튼 (픽토그램) -->
      <a href="index.html" class="home-button" aria-label="홈페이지로 돌아가기" title="홈페이지로 돌아가기">
        <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>

      <!-- 3칸짜리 탭 네비게이션 -->
      <div class="tabs-container">
        <nav class="tabs-grid">
          <!-- 왼쪽 칸: 자기소개 -->
          <a href="about.html" class="tab-item" id="tab-about">
            👤 자기소개
          </a>
          <!-- 중앙 칸: 포트폴리오 -->
          <a href="portfolio.html" class="tab-item" id="tab-portfolio">
            💼 포트폴리오
          </a>
          <!-- 우측 칸: 일단 비워둠 -->
          <div class="tab-item empty-tab" id="tab-empty" title="준비 중인 탭입니다">
            (비어 있음)
          </div>
        </nav>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main-content">
    <section class="hero-section">
      <h1 class="page-title">Welcome to My Space ✨</h1>
      <p class="page-subtitle">
        안녕하세요! 웹 개발과 데이터 분석에 열정을 가진 개발자 공간입니다.<br>
        상단 탭을 클릭하여 자기소개와 포트폴리오를 둘러보세요.
      </p>
      <div style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
        <button type="button" class="copy-badge" data-copy="algethi97@gmail.com" data-message="이메일 주소(algethi97@gmail.com)가 복사되었습니다!" title="클릭하여 이메일 주소 복사">
          📧 이메일 복사하기 <span class="copy-icon">📋</span>
        </button>
      </div>
    </section>

    <!-- 바로가기 카드 섹션 -->
    <section class="home-links-grid">
      <div class="quick-link-card">
        <div>
          <h2>👤 자기소개</h2>
          <p style="color: var(--text-muted); margin-top: 0.75rem;">
            저의 경험, 다룰 수 있는 기술 스택, 그리고 개발 철학을 소개합니다.
          </p>
        </div>
        <a href="about.html" class="btn">자기소개 보러가기 &rarr;</a>
      </div>

      <div class="quick-link-card">
        <div>
          <h2>💼 포트폴리오</h2>
          <p style="color: var(--text-muted); margin-top: 0.75rem;">
            지금까지 진행해 온 다양한 웹 서비스 및 프로젝트 결과물들을 확인하세요.
          </p>
        </div>
        <a href="portfolio.html" class="btn">프로젝트 둘러보기 &rarr;</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 algethi97. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
